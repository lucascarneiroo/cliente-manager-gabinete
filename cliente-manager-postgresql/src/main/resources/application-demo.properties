# ============================================================================
# Perfil de DEMONSTRACAO
# Ativado com: SPRING_PROFILES_ACTIVE=demo
# Use este perfil apenas na instalacao publica de demonstracao comercial,
# nunca na instalacao real de um cliente.
# ============================================================================

app.ambiente-demonstracao=true
app.nome-sistema=Gestao de Gabinete - Demonstracao

# Cria cidadaos, atendimentos e compromissos ficticios somente se o banco
# ainda estiver vazio (ver DemoDataLoader). Nunca roda em producao porque
# este arquivo so e carregado quando o perfil "demo" esta ativo.
app.demo.carregar-dados-ficticios=true

# A "integracao" de WhatsApp no perfil demo e sempre uma simulacao visual
# (SimulacaoWhatsappService). Nenhuma chamada real a API da Meta e feita,
# mesmo que WHATSAPP_HABILITADO=true tenha sido definido por engano.
app.whatsapp.simulacao-demo=true
