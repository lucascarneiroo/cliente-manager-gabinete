# ============================================================================
# Configuracao principal - Sistema de Gestao de Gabinete
# Os valores depois de ':' sao usados apenas quando a variavel de ambiente
# nao existe (ex.: desenvolvimento local). Em producao (Render), defina as
# variaveis de ambiente reais e nunca grave senhas neste arquivo.
# ============================================================================

spring.application.name=gestao-gabinete

# --- Banco de dados (PostgreSQL) ---------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gabinete_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Xolune16}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Recife

# A hospedagem (Render) fornece a porta automaticamente.
server.port=${PORT:8080}
spring.thymeleaf.cache=false

# --- Sessao HTTP ---------------------------------------------------------
# Expira automaticamente apos 30 minutos sem atividade.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
# Em producao (HTTPS no Render), habilite o cookie seguro via variavel de ambiente:
# SERVER_SERVLET_SESSION_COOKIE_SECURE=true
server.servlet.session.cookie.secure=${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}

# --- Primeiro administrador ----------------------------------------------
# Criado automaticamente somente quando a tabela "usuarios" estiver vazia.
# Defina estas variaveis de ambiente antes de subir o sistema pela primeira vez.
app.admin.nome=${APP_ADMIN_NOME:}
app.admin.usuario=${APP_ADMIN_USUARIO:}
app.admin.senha=${APP_ADMIN_SENHA:}

# --- Identidade e personalizacao (ver PERSONALIZACAO.md) ------------------
app.nome-sistema=${APP_NOME_SISTEMA:Gestao de Gabinete}
app.nome-gabinete=${APP_NOME_GABINETE:Gabinete Parlamentar}
app.nome-vereador=${APP_NOME_VEREADOR:}
app.subtitulo=${APP_SUBTITULO:Gestao de atendimentos}
app.descricao=${APP_DESCRICAO:Sistema de organizacao de cidadaos, atendimentos e compromissos do gabinete}
app.logo=${APP_LOGO:/images/logo-placeholder.svg}
app.cor-primaria=${APP_COR_PRIMARIA:#173B67}
app.cor-secundaria=${APP_COR_SECUNDARIA:#2563A6}
app.rodape=${APP_RODAPE:Sistema de Gestao de Gabinete}
app.ambiente-demonstracao=${APP_AMBIENTE_DEMONSTRACAO:false}

# --- Usuario de demonstracao (somente quando o perfil "demo" esta ativo) --
app.demo.usuario=${APP_DEMO_USUARIO:}
app.demo.senha=${APP_DEMO_SENHA:}

# --- Integracao opcional com WhatsApp (Meta Cloud API) ---------------------
# Ver GUIA_WHATSAPP.md. Desabilitada por padrao: o restante do sistema
# funciona normalmente e nenhuma chamada a API da Meta e feita.
app.whatsapp.habilitado=${WHATSAPP_HABILITADO:false}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID:}
app.whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
app.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
app.whatsapp.api-version=${WHATSAPP_API_VERSION:v20.0}
app.whatsapp.retencao-dias-mensagens=${WHATSAPP_RETENCAO_DIAS:365}

# --- Logs: nunca registrar dados sensiveis --------------------------------
logging.level.org.springframework.security=WARN
