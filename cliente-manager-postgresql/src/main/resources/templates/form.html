<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="(${cliente.id != null} ? 'Editar Cidadao' : 'Novo Cidadao') + ' - ' + ${appConfig.tituloExibicao}"></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <th:block th:replace="~{fragments/layout :: cores}"></th:block>
</head>
<body>

<div th:replace="~{fragments/layout :: cabecalho('cidadaos')}"></div>

<main>
    <section class="page-head">
        <div><span class="eyebrow">Cadastro</span><h2 th:text="${cliente.id != null} ? 'Atualizar cidadao' : 'Novo cidadao'"></h2><p>Preencha os dados abaixo para manter o cadastro organizado.</p></div>
        <a class="btn secundario" th:href="@{/clientes}">Voltar a lista</a>
    </section>

    <div th:if="${erro}" class="alerta erro" th:text="${erro}"></div>

    <div class="ficha">
        <h2>Informacoes do cidadao</h2>

        <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post">

            <input type="hidden" th:field="*{id}">

            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: Maria da Silva Souza">
                <p class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>
            </div>

            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" th:field="*{cpf}" placeholder="000.000.000-00">
                <p class="erro-campo" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></p>
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" th:field="*{telefone}" placeholder="(81) 99999-9999" maxlength="20" autocomplete="tel">
                <p class="erro-campo" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></p>
            </div>

            <div class="campo">
                <label for="endereco">Endereco</label>
                <input type="text" id="endereco" th:field="*{endereco}" placeholder="Rua, numero, bairro, cidade - UF">
                <p class="erro-campo" th:if="${#fields.hasErrors('endereco')}" th:errors="*{endereco}"></p>
            </div>

            <div class="campo">
                <label for="dataNascimento">Data de nascimento</label>
                <input type="date" id="dataNascimento" th:field="*{dataNascimento}">
                <p class="ajuda">No dia do aniversario, o cidadao sera destacado na pagina inicial.</p>
            </div>

            <div class="campo">
                <label for="descricao">Descricao / observacoes</label>
                <textarea id="descricao" th:field="*{descricao}" placeholder="Observacoes, historico, encaminhamentos..."></textarea>
                <p class="erro-campo" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></p>
            </div>

            <div class="acoes-form">
                <button type="submit" class="btn">Salvar</button>
                <a class="btn secundario" th:href="@{/clientes}">Cancelar</a>
            </div>

        </form>
    </div>

</main>

<div th:replace="~{fragments/layout :: rodape}"></div>

</body>
</html>
