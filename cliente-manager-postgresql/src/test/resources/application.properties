# Usado exclusivamente por "mvn test". A aplicacao real usa sempre PostgreSQL
# (ver application.properties); aqui trocamos apenas por um banco H2 em
# memoria para que os testes rodem sem exigir um PostgreSQL disponivel.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Primeiro administrador de teste (nunca usado fora dos testes automatizados)
app.admin.nome=Administrador de Teste
app.admin.usuario=admin.teste
app.admin.senha=SenhaDeTeste123

app.whatsapp.habilitado=false
